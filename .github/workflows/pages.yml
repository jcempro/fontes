name: Publicar Índice EGW

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .agents/cache/packages
          key: egw-packages-${{ runner.os }}-${{ hashFiles('src/data/books/**/metadata.json', 'src/assets/books/**/source.pdf', 'src/assets/books/**/source.epub', 'src/config/build.json') }}
          restore-keys: |
            egw-packages-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils p7zip-full
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
